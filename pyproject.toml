[project]
name = "swing-lab"
version = "0.1.0"
description = "Autonomous Indian swing-trading research lab (paper mode)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.40",
  "requests>=2.32",
  "curl-cffi>=0.16",
  "python-multipart>=0.0.9",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not network'"
markers = [
  "network: test hits real network endpoints (run explicitly with -m network)",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
